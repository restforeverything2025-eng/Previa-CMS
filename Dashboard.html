<!DOCTYPE html>
<html>

<head>

  <base target="_top">

<style>

   body{

      font-family: Arial, sans-serif;

      padding:24px;

      background:#f5f5f5;

    }

   h1{

  margin-top:0;

}

.card{

  background:#fff;

  border-radius:12px;

  padding:18px;

  box-shadow:0 1px 4px rgba(0,0,0,.10);

  border:1px solid #ececec;

}

.dashboard-grid{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:14px;

}

.full-width{

  grid-column:1 / -1;

}

.value{

  font-size:26px;

  font-weight:700;

  color:#202124;

  line-height:1.2;

}

.label{

  font-size:12px;

  color:#5f6368;

  text-transform:uppercase;

  letter-spacing:.6px;

  margin-bottom:6px;

}

.subtitle{

  color:#5f6368;

  margin-top:-10px;

  margin-bottom:22px;

  font-size:14px;

}

.actions-container{

  margin-top:12px;

}

.dashboard-button{

  width:100%;
  padding:10px;

}

.dashboard-button:not(:last-child){

  margin-bottom:8px;

}

.publish-date{

  margin-top:8px;
  color:#666;
  font-size:13px;

}

</style>

</head>

<body>

  <h1>PREVIA CMS</h1>

<div class="subtitle">

  Vintage Boutique Workspace

</div>

<div id="dashboard">

  Loading...

</div>

  <script>

google.script.run
  .withSuccessHandler(render)
  .getDashboardData();

function render(data){

  document.getElementById("dashboard").innerHTML =
    renderStatistics(data) +
    renderActions() +
    renderLastPublication(data);

}

function createStatCard(label, value){

  return `

<div class="card">

<div class="label">${label}</div>

<div class="value">${value}</div>

</div>

`;

}

function renderStatistics(data){

  return `

<div class="dashboard-grid">

${createStatCard("Products", data.products)}

${createStatCard("New Products", data.newProducts)}

${createStatCard("Folders", data.folders)}

${createStatCard("Images", data.images)}

</div>

`;

}

function renderActions(){

  return `

<div class="card full-width">

<div class="label">

Actions

</div>

<div class="actions-container">

<button disabled class="dashboard-button">
🚀 Publish Boutique
</button>

<button disabled class="dashboard-button">
🖼 Refresh Images
</button>

<button disabled class="dashboard-button">
📦 More actions coming soon
</button>

</div>

</div>

`;

}

function renderLastPublication(data){

  return `

<div class="card full-width">

<div class="label">

Last Publish

</div>

<div class="value">

${data.result}

</div>

<div class="publish-date">

${data.date}

</div>

</div>

`;

}

</script>

</body>

</html>
