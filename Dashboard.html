<!DOCTYPE html>
<html>

<head>

  <base target="_top">

  <style>

    body{

      font-family: Arial, sans-serif;

      padding:24px;

      background:#f5f5f5;

    }

    h1{

      margin-top:0;

    }

    .card{

  background:#fff;

  border-radius:12px;

  padding:18px;

  box-shadow:0 1px 4px rgba(0,0,0,.10);

  border:1px solid #ececec;

}

    .dashboard-grid{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:14px;

}

.full-width{

  grid-column:1 / -1;

}

.label{

      color:#666;

      font-size:13px;

    }

    .value{

  font-size:26px;

  font-weight:700;

  color:#202124;

  line-height:1.2;

}

.label{

  font-size:12px;

  color:#5f6368;

  text-transform:uppercase;

  letter-spacing:.6px;

  margin-bottom:6px;

}

.subtitle{

  color:#5f6368;

  margin-top:-10px;

  margin-bottom:22px;

  font-size:14px;

}

  </style>

</head>

<body>

  <h1>PREVIA CMS</h1>

<div class="subtitle">

  Vintage Boutique Workspace

</div>

<div id="dashboard">

  Loading...

</div>

  <script>

    google.script.run

      .withSuccessHandler(render)

      .getDashboardData();

function render(data){

  document.getElementById(
    "dashboard"
  ).innerHTML =

    renderStatistics(data) +

    renderActions() +

    renderLastPublication(data);

;}

function renderStatistics(data){

  return `

<div class="dashboard-grid">

<div class="card">

<div class="label">Products</div>

<div class="value">${data.products}</div>

</div>

<div class="card">

<div class="label">New Products</div>

<div class="value">${data.newProducts}</div>

</div>

<div class="card">

<div class="label">Folders</div>

<div class="value">${data.folders}</div>

</div>

<div class="card">

<div class="label">Images</div>

<div class="value">${data.images}</div>

</div>

`;

}

function renderActions(){

  return `

<div class="card full-width">

<div class="label">

Actions

</div>

<div style="margin-top:12px;">

<button
disabled
style="width:100%;padding:10px;margin-bottom:8px;">

🚀 Publish Boutique

</button>

<button
disabled
style="width:100%;padding:10px;margin-bottom:8px;">

🖼 Refresh Images

</button>

<button
disabled
style="width:100%;padding:10px;">

📦 More actions coming soon

</button>

</div>

</div>

`;

}

function renderLastPublication(data){

  return `

<div class="card full-width">

<div class="label">

Last Publish

</div>

<div class="value">

${data.result}

</div>

<div
style="margin-top:8px;color:#666;font-size:13px;">

${data.date}

</div>

</div>

</div>

`;

}

  </script>

</body>

</html>
