<!DOCTYPE html>
<html>

<head>

  <base target="_top">

<style>

   body{

      font-family: Arial, sans-serif;

      padding:24px;

      background:#f5f5f5;

    }

   h1{

  margin-top:0;

}

.card{

  background:#fff;

  border-radius:12px;

  padding:18px;

  box-shadow:0 1px 4px rgba(0,0,0,.10);

  border:1px solid #ececec;

}

.dashboard-grid{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:14px;

}

.full-width{

  grid-column:1 / -1;

}

.value{

  font-size:26px;

  font-weight:700;

  color:#202124;

  line-height:1.2;

}

.label{

  font-size:12px;

  color:#5f6368;

  text-transform:uppercase;

  letter-spacing:.6px;

  margin-bottom:6px;

}

.subtitle{

  color:#5f6368;

  margin-top:-10px;

  margin-bottom:22px;

  font-size:14px;

}

.actions-container{

  margin-top:12px;

}

.dashboard-button{

  width:100%;
  padding:10px;

}

.dashboard-button:not(:last-child){

  margin-bottom:8px;

}

.publish-date{

  margin-top:8px;
  color:#666;
  font-size:13px;

}

.report-modal.hidden{

  display:none;

}

.report-modal{

  position: fixed;

  inset: 0;

  background: rgba(0,0,0,0.45);

  display: flex;

  justify-content: center;

  align-items: center;

}

.report-box{

  width: 520px;

  max-width: 90%;

  background: white;

  border-radius: 12px;

  box-shadow: 0 10px 30px rgba(0,0,0,.25);

  padding: 24px;

}

.input-modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.input-modal.hidden {
  display: none;
}

.input-box {
  background: white;
  border-radius: 12px;
  padding: 24px;
  width: 360px;
  max-width: 90%;
  box-shadow: 0 8px 24px rgba(0,0,0,.2);
}

.input-box h2 {
  margin-top: 0;
  margin-bottom: 20px;
}

.input-box label {
  display: block;
  margin-bottom: 8px;
  font-weight: 600;
}

.input-box input {
  width: 100%;
  box-sizing: border-box;
  padding: 10px 12px;
  font-size: 14px;
  margin-bottom: 20px;
}

.input-buttons {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}

</style>

</head>

<body>

  <h1>PREVIA CMS</h1>

<div class="subtitle">

  Vintage Boutique Workspace

</div>

<div id="dashboard">

  Loading...

</div>

  <script>

google.script.run
  .withSuccessHandler(render)
  .getDashboardData();

  let selectedProduct = null;
  let returnToInputDialog = false;

function render(data){

  document.getElementById("dashboard").innerHTML =
    renderStatistics(data) +
    renderActions() +
    renderLastPublication(data);

}

function createStatCard(label, value){

  return `

<div class="card">

<div class="label">${label}</div>

<div class="value">${value}</div>

</div>

`;

}

function renderStatistics(data){

  return `

<div class="dashboard-grid">

${createStatCard("Products", data.products)}

${createStatCard("New Products", data.newProducts)}

${createStatCard("Folders", data.folders)}

${createStatCard("Images", data.images)}

</div>

`;

}

function renderActions(){

  return `

<div class="card full-width">

<div class="label">

Actions

</div>

<div class="actions-container">

<button
  class="dashboard-button"
  onclick="handleAction('publish')">
  🚀 Publish Boutique
</button>

<button
  class="dashboard-button"
  onclick="handleAction('archive')">
  📦 Archive
</button>

<button disabled class="dashboard-button">
🖼 Refresh Images
</button>

</div>

</div>

`;

}

function renderLastPublication(data){

  return `

<div class="card full-width">

<div class="label">

Last Publish

</div>

<div class="value">

${data.result}

</div>

<div class="publish-date">

${data.date}

</div>

</div>

`;

}

function handleAction(action){

  switch(action){

    case "publish":

      publishBoutique();

      break;

    case "archive":

      archiveProductPrompt();

      break;

    default:

      console.warn("Unknown action:", action);

  }

}

function archiveProductPrompt() {

  showInputDialog(
  "Archive Product",
  "Enter SKU"
);

}

function publishBoutique(){

  google.script.run

    .withSuccessHandler(function(result){

  showReport(
    "Publication Report",
    result
  );

})

    .withFailureHandler(function(error){

  console.error(error);

  showReport(
    "Publication Error",
    error.message || String(error)
  );

})

    .publishBoutique(false);

}

function showReport(title, message) {

  document.getElementById("report-title").textContent = title;
  document.getElementById("report-content").textContent = message;

  document
    .getElementById("report-modal")
    .classList.remove("hidden");

}

function hideReport() {

  document
    .getElementById("report-modal")
    .classList.add("hidden");

}

function showInputDialog(title, label) {

  document.getElementById("input-title").textContent = title;

  document.querySelector('label[for="input-field"]').textContent = label;

  const input = document.getElementById("input-field");

  input.value = "";

  document
    .getElementById("input-modal")
    .classList.remove("hidden");

  input.focus();

}

function hideInputDialog() {

  document
    .getElementById("input-modal")
    .classList.add("hidden");

}

function showProductPreviewDialog(title, content) {

  document.getElementById(
    "product-preview-title"
  ).textContent = title;

  document.getElementById(
    "product-preview-content"
  ).innerHTML = content;

  document
    .getElementById("product-preview-modal")
    .classList.remove("hidden");

}

function hideProductPreviewDialog() {

  document
    .getElementById("product-preview-modal")
    .classList.add("hidden");

}

function getInputValue() {

  return document
    .getElementById("input-field")
    .value
    .trim()
    .toUpperCase();

}

function loadProductBySku(sku) {

  google.script.run
    .withSuccessHandler(showProductPreview)
    .withFailureHandler(showError)
    .getProductBySku(sku);

}

function showProductPreview(product) {

  if (!product) {

  returnToInputDialog = true;

  hideInputDialog();

  showReport(
    "Product Not Found",
    "No product with this SKU was found."
  );

  return;

}

  selectedProduct = product;

  hideInputDialog();

  const html = buildProductPreview(product);

  showProductPreviewDialog(
    "Archive Product",
    html
  );

}

function confirmArchive() {

  google.script.run

    .withSuccessHandler(function(result) {

      hideProductPreviewDialog();

      showReport(
        "Archive Report",
        result
      );

    })

    .withFailureHandler(function(error) {

      showReport(
        "Archive Error",
        error.message || String(error)
      );

    })

    .archiveProduct(selectedProduct.sku);

}

function buildProductPreview(product) {

  return `

<b>SKU:</b> ${product.sku}<br><br>

<b>Brand:</b> ${product.brand}<br>

<b>Name:</b> ${product.name}<br>

<b>Price:</b> ${product.price} ${product.currency}<br>

<b>Status:</b> ${product.status}

`;

}

function showError(error) {

  showReport(
    "Server Error",
    error.message || String(error)
  );

}

function testInputDialog() {

  const sku = getInputValue();

  loadProductBySku(sku);

}

</script>

<div id="report-modal" class="report-modal hidden">

  <div class="report-box">

    <div id="report-title" class="report-title">
      Message
    </div>

    <pre id="report-content" class="report-content"></pre>

    <button
  id="report-close"
  class="dashboard-button"
  onclick="hideReport()">
  OK
    </button>

  </div>

</div>

<div
  id="input-modal"
  class="input-modal hidden">

  <div class="input-box">

    <h2 id="input-title">
      Input
    </h2>

    <label for="input-field">
      SKU
    </label>

    <input
      id="input-field"
      type="text">

    <div class="input-buttons">

      <button
        id="input-cancel"
        onclick="hideInputDialog()">
        Cancel
      </button>

      <button
        id="input-confirm"
        onclick="testInputDialog()">
        Continue
      </button>

    </div>

  </div>

</div>

<!-- Product Preview Dialog -->
<div
  id="product-preview-modal"
  class="report-modal hidden">

  <div class="report-box">

    <div
      id="product-preview-title"
      class="report-title">

      Product Preview

    </div>

    <div
      id="product-preview-content"
      class="report-content">

    </div>

    <button
      id="product-preview-confirm"
      class="dashboard-button"
      onclick="confirmArchive()">
      Archive
    </button>

    <button
      id="product-preview-cancel"
      class="dashboard-button"
      onclick="hideProductPreviewDialog()">

      Cancel

    </button>

  </div>

</div>

</body>

</html>
